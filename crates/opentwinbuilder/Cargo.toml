[package]
name = "opentwinbuilder"
version = "0.1.0"
edition = "2021"
description = "OpenTwinBuilder — Rust desktop Studio (Bevy 3D + Iced RS UI) for digital twins"
license = "BSL-1.1"

[features]
default = []
iced-shell = []   # habilita el shell iced (Ribbon) — opcional

[dependencies]
## 3D rendering + real-time visualization, incl. Entity Picking (`bevy_picking`).
## `default-features = false` keeps audio/wayland out of the build; the X11
## backend is used (the only winit backend with dev libs on this host).
bevy = { version = "0.20", default-features = false, features = [
    "x11",
    "2d",
    "3d",
    "ui",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_sprite",
    "bevy_ui",
    "bevy_text",
    "bevy_asset",
    "bevy_color",
    "bevy_scene",
    "bevy_state",
    "bevy_log",
    "bevy_picking",
    "mesh_picking",
    "default_font",
] }

## Cross-platform UI framework (ribbon / panels). Backend wgpu — Vulkan primary
## (forced in code via WGPU_BACKEND=vulkan); Metal (Apple) and other backends deferred.
iced = { version = "0.13", default-features = false, features = ["wgpu", "system"] }

## Stateless vitemcp MCP server core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
anyhow = "1"

## Lightweight blocking HTTP client for the Thingport self-hosted model library.
ureq = "2"
rmcp = { version = "3.8.0", features = ["server", "client", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
